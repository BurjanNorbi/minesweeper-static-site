				<li><a id="normal" class="alternate" href="#" onclick="setActiveStyleSheet('normal'); return false;">Normál változat</a></li>
			</ul>
		</nav>

	</header>
	<main id="tartalom">
		<div>
			<h1>Kapcsolat felvétel</h1>
			<form action="mailto:emailid@example.com" method="post">
				<div class="">
					<label for="email">Email-cím:</label>
					<input class="text-type" type="email" id="email" name="email" autocomplete="email" placeholder="pelda@email.hu" required maxlength="100"><br>
				</div>
				<div class="">
					<label for="uzenet">Üzenet:</label>
					<textarea class="text-type" id="uzenet" name="uzenet" rows="6" cols="42" placeholder="Üzenet helye" required maxlength="500"></textarea><br>
				</div>
				<div class="valasztok">
					<div class="left">
						<input type="radio" id="hibabejelentes" name="uzenet_fajta" required>
						<label for="hibabejelentes">Hibabejelentés*</label><br>
						<input type="radio" id="uzenet_kuldes" name="uzenet_fajta" required>
						<label for="uzenet_kuldes">Üzenet*</label><br>
					</div>
					<div class="right">
						<input type="checkbox" id="valasz" name="valasz">
						<label for="valasz">Szeretnék választ</label>
					</div>
				</div>
				<div class="gombok">
					<input type="submit" value="Küldés">
					<input type="reset" value="Alaphelyzet">
				</div>
				<aside>
					<p>*Kérem válassza ki az egyik lehetőséget!</p>
				</aside>
			</form>
		</div>
	</main>

			<div>
				<p>Források:</p>
